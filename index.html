  "m1_wrapup": "公平比較人與機器的關鍵，是把比較單位講清楚，並把結論寫成條件句。用同一條 KSA 公式描述人與機器，可以看出知識、技能與基礎能力最容易比較，態度與動機較難，而承擔責任根本無法寫入機器。這些區分是後續所有替代性分析的基礎：先講清楚比的是什麼，結論才有意義。",
  "m1_p1": "比較人與機器時，最常見的錯誤是挑選有利的對照：說機器較強時拿表現最差的人來比，說人類較強時又拿專家來比。公平的比較必須先固定哪一種人、哪一個系統，以及哪一項任務與衡量指標，因此許多說法只能寫成條件句。第一個例子是學習的「樣本效率」：學一個新概念時，幼兒看過幾個例子就能類推，機器學習模型通常需要大量訓練資料，所以以「每個學習樣本」計算時，人類效率較高；但若把一個人多年累積的生活經驗都算進去，結論就可能翻轉。第二個例子是「人類較節能」：只比較大腦的耗能時成立；但 Tomlinson 等人（2024）比較寫一頁約 250 字文字的碳排放，人類作者以寫作所需約 0.8 小時內的人均碳足跡計算，AI（ChatGPT 與 BLOOM）則包含分攤後的模型訓練與每次生成的耗電，結果 AI 每頁的二氧化碳當量排放比人類低 130 到 1,500 倍。要注意的是，人類這一端計入的是作者在這段時間內全部的生活碳足跡（包括食衣住行），不只是寫作本身的耗能；換了計算範圍，結論就跟著改變。",
  "m1_p2": "脫離情境與任務的「機器比人強」或「人比機器強」，都沒有確定的意義。",
  "m1_p3": "用 Competency = f(K, S, A｜情境, 任務) 描述機器時，知識對應模型權重中的知識與外部檢索資料，技能對應學到的程序、工具使用與動作控制，基礎能力對應模型架構、參數規模與感測器規格，三者的可比擬性都高，不過機器的技能對提示措辭與情境變化較敏感。態度對應透過規則、對齊訓練或系統設定形成的行為傾向，例如謹慎、禮讓、拒絕危險指令；功能上可以指定，但必須驗證，所以可比擬性中等；動機則由指令或目標函數給定，可比擬性低。",
  "m1_p4": "責任要分成兩件事：「負責任的行為」（守法、安全優先、遇到不確定就停下）可以寫入規則與訓練，但開放世界的情況無法窮舉；「承擔責任」（出事時由誰賠償、受罰）則只能由法律與契約分配給人或組織。態度也一樣，重點不是機器是否真的有態度，而是它的行為傾向能否被驗證，包括遇到規則沒有寫到的新情境時，能否正確延伸。機器還有一項人類沒有的特性：可以整套更換成新版本，但每次更換都需要重新驗證。",

  "m2_overview": "替代的單位是任務與情境，不是整個職業。本模組介紹任務導向的自動化研究，並提出十一個評估構面，用來判斷一項任務在特定情境中被機器替代的可能性。",

  "m2_wrapup": "把職業拆成任務，再指明每項任務所處的情境，是替代性分析的第一步。十一個構面從技術、社會與風險、經濟與系統三方面提供判斷依據，但它們不是固定答案：機器進步會移動邊界，新任務也會不斷出現。評估時要記錄日期，並定期重新檢視。",
  "m2_p1": "一份職業是由多項任務組成的。Autor、Levy 與 Murnane（2003）發現，電腦替代的是能依明確規則完成的例行任務，並與非例行的問題解決及複雜溝通互補；他們分析美國 1960 至 1998 年的資料，發現電腦化可以解釋 1970 至 1998 年間勞動市場對大學學歷勞工相對需求增加的約 60%，而其中將近一半來自職稱相同的職業內部任務內容的改變。換句話說，職業名稱可能不變，但工作內容已經改變。",
  "m2_p2": "替代的單位是「任務 × 情境」，不是職業。",
  "m2_p3": "Frey 與 Osborne（2017）提出自動化的三個瓶頸：感知與操作、創意智力、社交智力。生成式 AI 出現後，後兩項已部分鬆動，因此本單元改用十一個構面：技術面包括任務可規格化、情境封閉度、資料與回饋、實體操作；社會與風險面包括社交互動與信任、錯誤代價、責任可歸屬；經濟與系統面包括經濟性、任務可拆解性、整合協調成本、情境可改造性。",
  "m2_p4": "Acemoglu 與 Restrepo（2019）提醒，自動化會讓機器取代原本由人執行的任務，稱為取代效果；但新任務的出現會讓勞動重新受到需求，稱為恢復效果。因此分析時不只要看哪些任務會被取代，也要看哪些新任務會出現。所有構面也都會隨機器進步而移動，評估結果有時效性。",

  "m3_overview": "替代不是全有或全無。本模組介紹五級替代程度、多台機器組合完成一個角色時的最弱環節原則，以及從界定角色到規劃新角色的六步驟分析流程。",

  "m3_wrapup": "五級替代程度讓我們能精確描述人與機器的分工，而不是只說「會不會被取代」。多機協作提醒我們：整個角色需要多少人，取決於最難替代的那項關鍵任務，也就是最弱環節。六步驟流程把這些概念串成可重複使用的方法，而且必須隨機器更新定期重做。",
  "m3_p1": "借用汽車自動駕駛的分級邏輯，替代程度可分為五級：0 人類執行；1 機器輔助，人類決策與執行；2 監督下執行，機器執行而人類全程監督、隨時接手；3 範圍內替代，在界定的範圍內由機器執行，超出範圍時交回人類或安全停止；4 全面替代，在人類能執行的所有情境中都由機器執行。",
  "m3_p2": "只要有一項關鍵任務無法由機器安全完成，就必須保留人力。",
  "m3_p3": "替代不必由一台萬能機器完成。一個角色可以拆成多項任務，分別交給專長不同的機器，再整合成一套系統。這時要問三個問題：每項任務都有機器能做嗎？機器之間能否整合？整合本身就是新任務，誰負責協調、交接會不會出錯、整套系統出事由誰負責，都需要人或制度承擔。能不能改造情境來配合機器，例如鋪設清楚的道路標線，或把居家空間做好防護，以降低對臨場反應的需求？結果要區分兩種：人力減量，即一個人搭配機器負責更多對象；以及角色消失。",
  "m3_p4": "分析流程有六個步驟：1 界定角色與情境；2 拆解任務，標示關鍵任務；3 為每項任務配對機器，比較人與機器的構成要素；4 以十一構面評分；5 判定替代程度並找出最弱環節；6 規劃人的新角色，例如監督、例外處理、整合與承擔責任。機器更新或情境改變時，要回到步驟 1 重新評估。",

  "m4_overview": "汽車駕駛是單一整合系統替代人類任務的典型案例。本模組依六步驟分析職業駕駛，說明運作設計範圍、各項任務的替代程度，以及責任如何從駕駛人移轉到製造商。",
  "m4_highlights": [
   "SAE J3016",
   "動態駕駛任務",
   "運作設計範圍 ODD",
   "第 3 級",

   "無人計程車"

  "m4_wrapup": "駕駛案例顯示，替代程度取決於情境：在劃定範圍的城市道路上已進入範圍內替代，但鄉間道路、惡劣天候與最後一哩的搬運仍需要人。責任並沒有消失，而是從駕駛人移轉到製造商或營運商。擴大運作範圍時，每一次都要重新驗證，這也說明替代邊界雖然會移動，但速度受到驗證成本限制。",
  "m4_p1": "SAE J3016 把駕駛自動化定義為持續執行部分或全部「動態駕駛任務」的系統，並依人類駕駛與系統各自的角色分為 0 到 5 級（SAE International, 2026）。第 3 級指系統在限定條件下駕駛，發出警示或明顯故障時需要人類接手。這個「限定條件」稱為運作設計範圍（ODD），也就是公式中的「情境」。",
  "m4_p2": "職業駕駛不會整個被替代；被替代的是特定運作設計範圍內的駕駛任務。",
  "m4_p3": "拆解職業駕駛的任務：感知與反應、車輛操控、交通規則與路線，在運作設計範圍內機器表現較強，因為它能 360 度感測、不會疲勞、反應快。防禦性駕駛可以寫入規則，但極端情境仍待驗證。超出範圍時的處置、搬運貨物、送貨進門與乘客服務，則仍是機器的弱項。",
  "m4_p4": "責任方面，Mercedes-Benz 在 2022 年表示，其第 3 級系統啟動時發生的事故由公司負責，系統關閉時由車主負責；駕駛若未依要求接手則不在此限。責任是從駕駛人移轉到製造商，而非移轉到機器。現況上，Waymo 在 2026 年 3 月的規模已達每週 50 萬趟付費行程，同年 9 月把付費無人計程車擴展到美國 14 座城市；每座新城市開放大眾前，都先經過約兩個月只載員工的試營運。人的角色則轉向遠端監督、例外處理、實體操作、客戶服務與承擔責任。",

  "m5_nav": "5. 案例：教師",
  "m5_title": "案例二：教師（純知識傳授）",
  "m5_overview": "本模組刻意把教師限定為純知識傳授者，不含教練與照顧的功能。分析顯示傳授本身的替代性很高，但實證研究指出，學習成效取決於傳授之外的教練功能。",
  "m5_highlights": [
   "純知識傳授者",
   "AI 家教",
   "防護設計",
   "AI 拐杖效應",
   "MOOC 完成率",
   "把關與認證"
  ],
  "m5_wrapup": "純知識傳授是一個幾乎可以被替代的角色，但它一直不是教育價值的主要來源。這個案例的瓶頸和駕駛相反：不在技術，而在學習者本身的動機、自律與認知努力。AI 若只給答案，反而會讓學生失去練習的機會；能替代的是知識的傳遞，不能替代的是讓學生真正學會的歷程設計與對結果負責。",
  "m5_p1": "拆解純知識傳授的任務：講解概念、回答提問、出題與批改知識性測驗，機器的表現都很強，替代性高；診斷迷思概念與更新學科內容屬中等；決定什麼值得教、為內容正確性與評分負責、總結性評量與學歷認證，則涉及價值判斷與責任，替代性低。與駕駛相比，傳授幾乎不需要實體操作、單次錯誤可補救、資料極為豐富，技術上的替代門檻更低。",
  "m5_p2": "內容早就可以免費取得；學不會的原因在於動機、自律與回饋。",
  "m5_p3": "實證結果符合「傳授可替代」：哈佛大學一門入門物理課的隨機對照試驗（194 名大學生）中，依教學最佳實務設計的 AI 家教，比由教師帶領、本身已很受肯定的主動學習課堂，讓學生在更短時間內學得更多，也更投入（Kestin et al., 2025）；但樣本只有一所大學的一門課，推論範圍有限。另一項在土耳其近千名高中生的數學實驗發現，使用一般 GPT-4 介面練習的組別，練習時表現較好，但之後在不能使用 AI 的考試中，成績比從未使用 AI 的對照組低 17%；加上不直接給答案等防護設計後，負面效果大致消失（Bastani et al., 2025）。所謂防護，正是教練的功能。",
  "m5_p4": "歷史上，書本、廣播與大規模開放線上課程（MOOC）都曾被期待取代講授，但 MOOC 的完成率長期偏低（Reich & Ruipérez-Valiente, 2019）。替代程度因情境而異：知識結構清楚、內容穩定、風險低，而且學習者自律、動機強時，可達範圍內替代，由 AI 完成傳授，人類負責內容把關與認證；自律能力弱的初學者必須搭配教練與照顧；高風險的認證則仍在人類端。教師的角色會轉向學習設計者、教練與把關認證者。",

  "m6_nav": "6. 案例：保母",
  "m6_title": "案例三：1 歲幼兒保母",
  "m6_overview": "1 歲幼兒正在牙牙學語、學爬學走，仍需要餵食、穿衣與陪睡。本模組示範多台機器如何分工接手照顧任務，並說明為什麼結果是人力減量，而不是角色消失。",

  "m6_wrapup": "幼兒照顧顯示多機協作的威力與極限：後勤與監測可以分給多台機器，但最難替代的關鍵任務決定了必須留人。這個案例的瓶頸在身體與情感，錯誤代價高且不可逆。機器減少的是照顧者的雜務，而不是照顧本身；照顧者反而能把更多時間放在最需要人的地方。",
  "m6_p1": "拆解 1 歲幼兒保母的任務：清潔與洗衣（掃地機器人、洗衣機）、與父母溝通及記錄（AI 摘要）的替代性高；睡眠監測（智慧監測器）中高；沖泡奶與備餐中等。安全看護雖有攝影機偵測與警示，卻無法即時伸手阻止跌倒或誤食；餵食、穿衣、換尿布、洗澡、陪睡與抱起安撫，都需要對脆弱身體做靈巧操作，目前沒有安全可用的機器。",
  "m6_p2": "多機組合可以接手後勤與監測，但身體照護、即時安全介入與回應式互動仍需要人。",
  "m6_p3": "情境（年齡）會改變替代範圍。獲美國食品藥物管理局核准的 SNOO 智慧搖籃能讓嬰兒維持仰睡，偵測到哭聲時自動以漸強的白噪音與搖動回應，但只適用於出生到六個月、尚不會翻身的嬰兒；到了 1 歲就不再適用。語言發展也需要真人：Kuhl、Tsao 與 Liu（2003）讓 9 個月大、在英語環境中成長的美國嬰兒接觸中文：與說中文的真人互動，嬰兒能學會辨識中文語音；只看錄影或只聽錄音則完全沒有效果。",
  "m6_p4": "依最弱環節原則，即時安全介入、身體照護與回應式互動這三項關鍵任務仍需人類，因此結果是人力減量，而非角色消失。照顧者把時間從家務與監看，移到餵食、穿衣、陪睡與互動，並負責整合多台設備、在警示時即時處理。能即時回應的 AI 是否能促進幼兒的語言與社會發展，目前尚無足夠研究，不宜推論。",

  "m7_nav": "7. 教育意涵",
  "m7_title": "教育意涵：讓學生理解未來工作被替代的挑戰",
  "m7_overview": "學生需要的不是一份「安全職業清單」，而是能自己重複使用的分析方法。本模組提出四個核心原則，並依國小到大學設計對應的學習活動。",
  "m7_highlights": [
   "用任務思考",
   "教會分析方法",
   "不恐嚇、不保證",
   "AI 拐杖",
   "分階段設計",
   "定期重評"
  ],
  "m7_wrapup": "讓學生理解被替代的挑戰，重點不在預測哪些職業會消失，而在培養一套可以不斷重複使用的分析能力，並在求學過程中真正長出能力。從國小的家事觀察到大學的人機協作設計，每個階段都在練習同一件事：拆解任務、指明情境、判斷人與機器的分工，並找出人該承擔的新角色。",
  "m7_p1": "四個核心原則：第一，用任務思考，問「這份工作有哪些任務會被機器做」，而不是「哪些職業會消失」。第二，不給安全清單，要教會分析方法，因為替代邊界持續移動，清單很快會過時。第三，既不恐嚇也不保證：舊任務會被取代，新任務也會出現（Acemoglu & Restrepo, 2019），重點是培養移動到新任務的能力。",
  "m7_p2": "讓 AI 代寫作業，等於從一開始就沒有培養能力，未來最容易被替代。",
  "m7_p3": "第四個原則是：被替代的風險從求學階段就開始。把 AI 當拐杖的學生，拿掉 AI 後表現反而更差（Bastani et al., 2025）。在國小階段，可以讓學生列出家事，找出哪些已由機器完成，再分組「幫保母設計機器人團隊」，自己發現機器做不到的事。國中階段可以訪談家長的工作內容，把工作拆成「機器做、機器幫忙、需要人」三類，再做一個 AI 實驗：同一份作業一組用 AI、一組不用，之後兩組都在不能使用 AI 的情況下測驗，親身體驗「AI 當拐杖」的代價。",
  "m7_p4": "高中階段可結合生涯規劃與自主學習，選一個目標職業，列出任務並用十一構面評分，推想 2035 年的情境，並放進學習歷程檔案。大學階段則以自己的科系為例，例如國際企業的貿易文件、市場研究、翻譯與談判，設計人機協作流程，找出自己要發展的構成要素與要承擔的責任。要避免的錯誤包括：用恐嚇代替理解、提供安全清單、只談職業名稱，以及忽略責任與新任務。",

  "m0_nav": "0. Executive Summary",
  "m0_title": "Executive Summary",
  "m0_intro": "AI agents and physical robots are taking over more and more work that people used to do, but asking which jobs will disappear is the wrong question. Jobs are bundles of tasks, and substitution happens at the level of task × context, not whole occupations. This unit first shows how to compare humans and machines fairly, by fixing which human, which system and which task, and uses one formula, Competency = f(K, S, A | context, task), to describe both. It then introduces eleven evaluation dimensions, five levels of substitution, the weakest-link rule for multi-machine systems and a six-step analysis process. Three cases put the method to work: driving, a teacher who only transmits knowledge, and a caregiver for a one-year-old. Finally, it discusses how students can prepare for future substitution. By the end you should be able to break down any job, judge which of its tasks could be substituted and why, and identify the new roles left for people. The unit has seven learning modules and four interactive labs, suits undergraduates from any department, and needs no programming background.",

  "m1_nav": "1. Comparing",
  "m1_title": "Comparing Humans and Machines",
  "m1_overview": "Before comparing humans and machines, fix which human, which system and which task. This module sets out the rules for a fair comparison, rewrites common claims as conditional statements, and uses the KSA formula to put humans and machines in one framework.",
  "m1_highlights": [
   "Units of comparison",
   "Conditional claims",
   "Competency = f(K, S, A | context, task)",
   "Mapping components",
   "Accountability",
   "Verifiability"

  "m1_wrapup": "Comparing humans and machines fairly means stating the unit of comparison and writing conclusions as conditional claims. Using the same KSA formula for both shows that knowledge, skills and abilities compare most easily, attitudes and motives less so, and accountability cannot be built into machines at all. These distinctions underpin every later analysis: only when you know exactly what is being compared does a conclusion mean anything.",
  "m1_p1": "The most common mistake in comparing humans and machines is choosing a convenient opponent: the weakest person when arguing that machines are better, and an expert when arguing the opposite. A fair comparison first fixes which human, which system and which task and metric, so many claims only hold as conditional statements. The first example is sample efficiency in learning. A young child can generalise a new concept from a few examples, while a machine learning model usually needs large amounts of training data, so humans are more efficient per learning example; counting all the life experience a person has accumulated over the years, the conclusion may reverse. The second example is the claim that humans use less energy, which holds when only the brain is counted. Tomlinson et al. (2024) compared the carbon emissions of writing one page of about 250 words. For human writers they prorated per-capita carbon footprints over the roughly 0.8 hours of writing time; for AI (ChatGPT and BLOOM) they included a share of model training plus the energy of each generation. AI emitted 130 to 1,500 times less CO2e per page than a human writer. Note that the human side counts the writer's whole living footprint during that time, including food, housing and transport, not just the energy used to write; change what is counted and the conclusion changes with it.",
  "m1_p2": "'Machines are better than people', or the reverse, means nothing definite without a stated context and task.",
  "m1_p3": "When Competency = f(K, S, A | context, task) is used for machines, knowledge maps to knowledge in the model's weights plus retrieved information; skills map to learned procedures, tool use and motor control; and abilities map to the model's architecture, size and sensor specifications. All three compare well, although machine skills are more sensitive to prompt wording and changes in context. Attitudes map to behavioural tendencies set by rules, alignment training or system settings, such as caution, courtesy and refusing dangerous instructions; they can be specified functionally but must be verified, so the fit is medium; motives are given by instructions or an objective function, a poor fit.",
  "m1_p4": "Responsibility has two meanings. Responsible behaviour, such as obeying rules, putting safety first and stopping when unsure, can be built into rules and training, though the open world has too many situations to list them all. Accountability, meaning who pays or is punished when something goes wrong, can only be assigned to people or organisations by law and contract. Attitudes work the same way: what matters is not whether a machine really has attitudes but whether its tendencies can be verified, including whether they extend correctly to situations the rules never covered. Machines also have a property people lack: they can be swapped for a newer version wholesale, though each swap needs fresh verification.",

  "m2_nav": "2. Framework",
  "m2_title": "Framework: Task × Context and Eleven Dimensions",
  "m2_overview": "The unit of substitution is the task in its context, not the whole occupation. This module introduces task-based research on automation and eleven dimensions for judging how likely a task is to be substituted in a given context.",
  "m2_highlights": [
   "Task × context",
   "Routine tasks",
   "Bottlenecks to automation",
   "Eleven dimensions",
   "Displacement effect",
   "Reinstatement effect"
  ],
  "m2_wrapup": "Breaking an occupation into tasks and stating each task's context is the first step in any substitution analysis. The eleven dimensions give grounds for judgement across technology, social and risk factors, and economics and systems, but they are not fixed answers: machine progress moves the boundary and new tasks keep appearing. Record the date of each assessment and revisit it regularly.",
  "m2_p1": "An occupation is a bundle of tasks. Autor, Levy and Murnane (2003) found that computers substitute for routine tasks that follow explicit rules and complement non-routine problem solving and complex communication. Using US data from 1960 to 1998, they found that computerisation explained about 60% of the rise in relative demand for college-educated workers between 1970 and 1998, and almost half of that came from changes in task content within occupations whose titles stayed the same. The job title may stay the same while the work itself changes.",
  "m2_p2": "The unit of substitution is task × context, not the occupation.",
  "m2_p3": "Frey and Osborne (2017) named three bottlenecks to automation: perception and manipulation, creative intelligence and social intelligence. Generative AI has partly loosened the last two, so this unit uses eleven dimensions instead. The technical ones are codifiability, bounded context, data and feedback, and physical manipulation. The social and risk ones are social interaction and trust, cost of error, and accountability. The economic and system ones are economics, decomposability, integration cost and redesignable context.",
  "m2_p4": "Acemoglu and Restrepo (2019) point out that automation lets machines take over tasks people used to do, the displacement effect, while new tasks create fresh demand for labour, the reinstatement effect. Analysis should therefore look at which new tasks appear as well as which tasks are replaced. Every dimension also shifts as machines improve, so any assessment has a date attached.",

    "front": "Routine tasks",
    "back": "Cognitive or manual tasks that follow explicit rules; the first to be computerised"

    "front": "Bottlenecks to automation",

  "m3_nav": "3. Levels and Process",
  "m3_title": "Levels, Multi-machine Systems and Process",
  "m3_overview": "Substitution is not all or nothing. This module introduces five levels of substitution, the weakest-link rule when several machines share one role, and a six-step process from defining the role to planning new human roles.",
  "m3_highlights": [
   "Five levels",
   "Substitution within a domain",
   "Multi-machine systems",
   "Weakest-link rule",
   "Fewer people needed",
   "Six-step process"
  ],
  "m3_wrapup": "Five levels let us describe the division of work between people and machines precisely, instead of asking only whether a job will be replaced. Multi-machine systems remind us that the hardest critical task, the weakest link, decides how many people a role still needs. The six-step process turns these ideas into a reusable method that must be repeated as machines improve.",
  "m3_p1": "Borrowing the logic of driving-automation levels, substitution has five levels. Level 0: humans do the work. Level 1: machines assist, while humans decide and act. Level 2: machines act under supervision, with humans watching throughout and ready to take over. Level 3: machines act within a defined domain and hand back to a human, or stop safely, outside it. Level 4: machines act in every situation a human could handle.",
  "m3_p2": "If even one critical task cannot be done safely by a machine, people must stay in the role.",
  "m3_p3": "Substitution does not need one machine that does everything. A role can be split into tasks, given to machines with different strengths and integrated into one system. Three questions follow. Can a machine do each task? Can the machines be integrated? Integration is itself a new task: someone, or some institution, must coordinate, guard against errors at hand-offs and answer for failures of the whole system. Can the setting be redesigned to suit machines, for example with clearer road markings or a child-proofed home, so that less depends on reacting on the spot? The outcome is either fewer people needed, with one person and machines covering more, or the role disappearing.",
  "m3_p4": "The analysis has six steps: 1 define the role and context; 2 break it into tasks and mark the critical ones; 3 match machines to each task and compare human and machine components; 4 score the eleven dimensions; 5 set the substitution level and find the weakest link; 6 plan new human roles such as supervision, handling exceptions, integration and accountability. When machines are upgraded or the context changes, start again at step 1.",

    "front": "Substitution within a domain",
    "back": "Level 3: machines act within a defined domain and hand back outside it"

    "front": "Supervised execution",

  "m4_title": "Case 1: Driving",
  "m4_overview": "Driving is the classic case of one integrated system taking over human tasks. This module applies the six steps to professional driving, explaining the operational design domain, how far each task can be substituted and how liability shifts from driver to manufacturer.",
  "m4_highlights": [

   "Shifting liability",
   "Robotaxis"

  "m4_wrapup": "The driving case shows that substitution depends on context. Mapped city streets have reached substitution within a domain, but rural roads, bad weather and last-mile handling still need people. Accountability does not vanish; it moves from driver to manufacturer or operator. Each expansion of the operating domain must be verified again, so the boundary moves, but at a pace limited by the cost of verification.",
  "m4_p1": "SAE J3016 defines driving automation as systems that perform part or all of the dynamic driving task on a sustained basis, with Levels 0 to 5 set by the roles of the human driver and the system (SAE International, 2026). At Level 3 the system drives under defined conditions, and a human must take over after an alert or an evident malfunction. Those defined conditions are the operational design domain, or ODD, which is the 'context' in the formula.",
  "m4_p2": "Professional drivers will not be replaced wholesale; what gets replaced is driving within a particular operational design domain.",
  "m4_p3": "Breaking down a professional driver's tasks: within the ODD, machines do better at perception and response, vehicle control, and traffic rules and routing, because they sense in 360 degrees, never tire and react fast. Defensive driving can be written into rules, though edge cases still need verification. Handling situations outside the ODD, loading cargo, delivering to the door and serving passengers remain weak points.",
  "m4_p4": "On liability, Mercedes-Benz said in 2022 that it is responsible for crashes while its Level 3 system is engaged and owners are responsible when it is off, unless the driver fails to take over when asked. Liability moves from the driver to the manufacturer, not to the machine. By March 2026 Waymo was giving 500,000 paid rides a week, and in September 2026 it expanded paid driverless ride-hailing to 14 US cities; each new city had about two months of employee-only rides before opening to the public. The human role shifts to remote supervision, exceptions, physical handling, customer service and accountability.",

  "m5_nav": "5. Case: Teaching",
  "m5_title": "Case 2: The Knowledge-transmitting Teacher",
  "m5_overview": "This module deliberately limits the teacher to transmitting knowledge, leaving out coaching and care. Transmission itself turns out to be highly substitutable, but the evidence shows that learning depends on coaching functions beyond transmission.",
  "m5_highlights": [
   "Knowledge transmitter",
   "AI tutor",
   "Guardrails",
   "AI as a crutch",
   "MOOC completion",
   "Gatekeeping and certification"
  ],
  "m5_wrapup": "Pure knowledge transmission is almost fully substitutable, but it was never the main source of educational value. The bottleneck here is the opposite of driving: not technology but the learner's motivation, self-discipline and effort. An AI that simply hands over answers takes away the practice students need. What can be substituted is the delivery of knowledge; what cannot is designing the process through which students really learn, and taking responsibility for the result.",
  "m5_p1": "Breaking down pure knowledge transmission: machines are strong at explaining concepts, answering questions, and setting and marking knowledge tests, so these are highly substitutable. Diagnosing misconceptions and updating content are medium. Deciding what is worth teaching, taking responsibility for accuracy and marks, and summative assessment and certification involve values and accountability, so substitutability is low. Compared with driving, transmission needs almost no physical action, single errors can be corrected and data is plentiful, so the technical barrier is lower.",
  "m5_p2": "Content has long been free; people fail to learn because of motivation, self-discipline and feedback.",
  "m5_p3": "The evidence supports substituting transmission. In a randomised trial with 194 students in an introductory physics course at Harvard, an AI tutor built on teaching best practice helped students learn more in less time, and feel more engaged, than an instructor-led active-learning class that was already well regarded (Kestin et al., 2025); with one course at one university, though, the findings generalise only so far. In a maths experiment with nearly 1,000 high school students in Turkey, those who practised with a plain GPT-4 interface did better during practice, but on a later exam without AI they scored 17% lower than a control group that never had AI; guardrails such as not giving answers directly largely removed this harm (Bastani et al., 2025). Those guardrails are exactly coaching functions.",
  "m5_p4": "Books, radio and massive open online courses (MOOCs) were each expected to replace lectures, yet MOOC completion rates stayed low (Reich & Ruipérez-Valiente, 2019). The level of substitution varies by context: where knowledge is well structured, content is stable, stakes are low and learners are self-disciplined and motivated, substitution within a domain is possible, with AI delivering content and people checking it and certifying results; novices with weak self-regulation still need coaching and care, and high-stakes certification stays with people. Teachers move towards being learning designers, coaches and gatekeepers.",

  "m6_overview": "A one-year-old is learning to talk, crawl and walk, and still needs feeding, dressing and settling to sleep. This module shows how several machines could share the care tasks and why the result is fewer caregivers rather than none.",

  "m6_wrapup": "Toddler care shows both the power and the limits of multi-machine systems. Logistics and monitoring can be spread across machines, but the hardest critical tasks mean a person must stay. The bottleneck here lies in the body and the emotions, and errors are costly and irreversible. Machines cut the chores, not the caring itself, freeing caregivers to spend more time where a person is needed most.",
  "m6_p1": "Breaking down the care of a one-year-old: cleaning and laundry (robot vacuums, washing machines) and keeping parents informed (AI summaries) are highly substitutable; sleep monitoring is medium-high; preparing milk and meals is medium. Cameras can detect and warn about hazards but cannot reach out in time to stop a fall or a swallowed object. Feeding, dressing, changing nappies, bathing, settling to sleep and picking the child up all need dexterous handling of a fragile body, and no safe machine does this today.",
  "m6_p2": "Machines can take over logistics and monitoring, but physical care, immediate safety response and responsive interaction still need a person.",
  "m6_p3": "Context, here age, changes what can be substituted. The FDA-authorised SNOO bassinet keeps babies on their backs and responds to crying with escalating white noise and rocking, but only from birth to six months, before babies can roll; it no longer fits a one-year-old. Language development also needs people: Kuhl, Tsao and Liu (2003) exposed nine-month-old American infants from English-speaking homes to Mandarin: those who interacted with live Mandarin speakers learned to tell Mandarin speech sounds apart, but recordings, whether video or audio only, had no effect.",
  "m6_p4": "By the weakest-link rule, immediate safety response, physical care and responsive interaction still need a person, so the result is fewer caregivers, not none. Caregivers shift time from housework and watching to feeding, dressing, settling and interacting, and they integrate the devices and act on alerts. Whether responsive AI can support toddlers' language and social development has not been researched enough to draw conclusions.",

const FlipCardDeck = ({ terms, t, moduleId, onCardRead }) => {
  const [groupIdx, setGroupIdx] = useState(0);
  const [flipped, setFlipped] = useState({});
  const [readSet, setReadSet] = useState(new Set());
  const [shownSet, setShownSet] = useState(new Set());
  const [shuffledOrder, setShuffledOrder] = useState(() => [...Array(terms.length).keys()].sort(() => Math.random() - 0.5));
  const groupSize = 2;
  const totalGroups = Math.ceil(terms.length / groupSize);
  const startIdx = groupIdx * groupSize;
  const currentCardIndices = shuffledOrder.slice(startIdx, startIdx + groupSize);
  useEffect(() => {
    const ns = new Set(shownSet);
    currentCardIndices.forEach(idx => ns.add(idx));
    if (ns.size !== shownSet.size) setShownSet(ns);
  }, [groupIdx, shuffledOrder]);
  const handleFlip = (origIdx) => {
    setFlipped(f => ({ ...f, [origIdx]: !f[origIdx] }));
    if (!readSet.has(origIdx)) {
      const nr = new Set(readSet); nr.add(origIdx); setReadSet(nr);
      if (onCardRead) onCardRead(moduleId, nr.size, shownSet.size, terms.length);
    }
  };
  const restart = () => {
    setShuffledOrder([...Array(terms.length).keys()].sort(() => Math.random() - 0.5));
    setGroupIdx(0); setFlipped({}); setShownSet(new Set());
  };
  const statusText = t.flip_status.replace('{read}', readSet.size).replace('{shown}', shownSet.size).replace('{total}', terms.length);
  return (
    <div className="mt-8">
      <h3 className="text-lg font-bold uppercase tracking-wider text-slate-500 mb-2">{t.key_terms}</h3>
      <p className="text-sm text-slate-400 mb-4">{statusText}</p>
      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
        {currentCardIndices.map((origIdx) => {
          const term = terms[origIdx];
          return (
            <div key={origIdx} className="perspective cursor-pointer h-40" onClick={() => handleFlip(origIdx)}>
              <div className={`transform-style-3d relative w-full h-full transition-transform duration-500 ${flipped[origIdx] ? 'rotate-y-180' : ''}`}>
                <div className="backface-hidden absolute inset-0 bg-white dark:bg-slate-800 rounded-xl p-4 flex flex-col items-center justify-center border border-slate-200 dark:border-slate-700 shadow-sm">
                  <p className="font-serif font-bold text-center text-[#004030] dark:text-[#D8C3A5]">{term.front}</p>
                  <p className="text-xs text-slate-400 mt-2">{t.flip_prompt}</p>
                </div>
                <div className="backface-hidden rotate-y-180 absolute inset-0 bg-[#004030] dark:bg-slate-700 rounded-xl p-4 flex items-center justify-center">
                  <p className="text-sm text-center text-[#D8C3A5] dark:text-slate-200 leading-relaxed">{term.back}</p>
                </div>
              </div>
            </div>
          );
        })}
      </div>
      <div className="flex items-center gap-3 mt-4">
        <button onClick={restart} className="px-4 py-2 text-sm border border-slate-300 dark:border-slate-600 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700">{t.flip_retry}</button>
        <button onClick={() => groupIdx < totalGroups - 1 && setGroupIdx(groupIdx + 1)} disabled={groupIdx >= totalGroups - 1}
          className="px-4 py-2 text-sm bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] font-bold rounded-lg disabled:opacity-40">{t.flip_next}</button>
      </div>
    </div>
  );
};

const ModuleQuiz = ({ questions, t, moduleId, onQuizSubmit, moduleName }) => {
  const [selected, setSelected] = useState({});
  const [submitted, setSubmitted] = useState({});
  const [groupIdx, setGroupIdx] = useState(0);
  const groupSize = 2;
  const [seed, setSeed] = useState(0);
  const [quizIndices, setQuizIndices] = useState(() => [...Array(questions.length).keys()].sort(() => Math.random() - 0.5));
  const totalGroups = Math.ceil(quizIndices.length / groupSize);
  const [shuffledMaps, setShuffledMaps] = useState(() => quizIndices.map(qIdx => [...Array(questions[qIdx].opts.length).keys()].sort(() => Math.random() - 0.5)));
  const totalAnswered = Object.keys(submitted).reduce((n, g) => n + Math.min(groupSize, quizIndices.length - g * groupSize), 0);
  const computeCorrect = () => {
    let c = 0;
    quizIndices.forEach((qIdx, qi) => {
      const g = Math.floor(qi / groupSize);
      if (!submitted[g] || selected[qi] === undefined) return;
      if (shuffledMaps[qi][selected[qi]] === _d(questions[qIdx].ans)) c++;
    });
    return c;
  };
  const statusText = t.quiz_status.replace('{correct}', computeCorrect()).replace('{answered}', totalAnswered).replace('{total}', quizIndices.length);
  const currentStart = groupIdx * groupSize;
  const currentIndices = quizIndices.slice(currentStart, currentStart + groupSize);
  const handleGroupSubmit = () => {
    const allDone = currentIndices.every((_, i) => selected[currentStart + i] !== undefined);
    if (!allDone) return;
    const newSub = { ...submitted, [groupIdx]: true };
    setSubmitted(newSub);
    const wrongQs = []; let correct = 0, answered = 0;
    quizIndices.forEach((qIdx, qi) => {
      const g = Math.floor(qi / groupSize);
      if (!newSub[g] || selected[qi] === undefined) return;
      answered++;
      if (shuffledMaps[qi][selected[qi]] === _d(questions[qIdx].ans)) correct++;
      else wrongQs.push(qIdx);
    });
    onQuizSubmit(moduleId, correct, answered, wrongQs, moduleName);
  };
  const retry = () => {
    const qi = [...Array(questions.length).keys()].sort(() => Math.random() - 0.5);
    setQuizIndices(qi);
    setShuffledMaps(qi.map(q => [...Array(questions[q].opts.length).keys()].sort(() => Math.random() - 0.5)));
    setGroupIdx(0); setSelected({}); setSubmitted({}); setSeed(seed + 1);
  };
  return (
    <div className="mt-8 bg-slate-50 dark:bg-slate-900/50 rounded-2xl p-4 sm:p-6 border border-slate-200 dark:border-slate-700">
      <h3 className="text-lg font-bold font-serif text-[#004030] dark:text-[#D8C3A5] mb-2">{t.quiz_title}</h3>
      <p className="text-sm text-slate-400 mb-6">{statusText}</p>
      {currentIndices.map((qIdx, localI) => {
        const qi = currentStart + localI;
        const q = questions[qIdx];
        const sMap = shuffledMaps[qi];
        const isGrpSub = !!submitted[groupIdx];
        const ok = sMap[selected[qi]] === _d(q.ans);
        return (
          <div key={`${seed}-${qIdx}`} className="mb-6">
            <p className="font-bold mb-3 text-base">{qi + 1}. {q.q}</p>
            <div className="space-y-2">
              {sMap.map((origIdx, dIdx) => {
                const isCorrect = origIdx === _d(q.ans);
                const isSel = selected[qi] === dIdx;
                return (
                  <button key={dIdx} onClick={() => !isGrpSub && setSelected(s => ({ ...s, [qi]: dIdx }))}
                    className={`w-full text-left px-4 py-3 rounded-lg border transition-all text-sm ${isGrpSub
                      ? isCorrect ? 'bg-green-100 border-green-500 dark:bg-green-900/30' : isSel ? 'bg-red-100 border-red-400 dark:bg-red-900/30' : 'border-slate-200 dark:border-slate-700'
                      : isSel ? 'border-[#004030] dark:border-[#D8C3A5] bg-[#004030]/5 dark:bg-[#D8C3A5]/10' : 'border-slate-200 dark:border-slate-700 hover:border-slate-400'}`}>
                    {q.opts[origIdx]}
                  </button>
                );
              })}
            </div>
            {isGrpSub && (
              <p className={`mt-2 text-sm italic ${ok ? 'text-green-600 dark:text-green-400' : 'text-red-500 dark:text-red-400'}`}>
                {ok ? `✓ ${t.correct}` : `✗ ${t.incorrect}`} — {t.explanation}{t.colon}{q.exp}
              </p>
            )}
          </div>
        );
      })}
      <div className="flex flex-wrap items-center gap-3">
        {!submitted[groupIdx]
          ? <button onClick={handleGroupSubmit} disabled={!currentIndices.every((_, i) => selected[currentStart + i] !== undefined)}
              className="px-6 py-2 bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] font-bold rounded-lg disabled:opacity-40">{t.submit}</button>
          : <>
              {groupIdx < totalGroups - 1 && (
                <button onClick={() => setGroupIdx(groupIdx + 1)} className="px-6 py-2 bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] font-bold rounded-lg">{t.quiz_next}</button>
              )}
              <button onClick={retry} className="px-6 py-2 border border-[#004030] dark:border-[#D8C3A5] text-[#004030] dark:text-[#D8C3A5] font-bold rounded-lg">{t.quiz_retry}</button>
            </>}
      </div>
    </div>
  );
};

const ClassifyLab = ({ lang, t, meta, cats, items: rawItems, after }) => {
  const [items, setItems] = useState(() => [...rawItems].sort(() => Math.random() - 0.5));
  const [ans, setAns] = useState({});
  const [checked, setChecked] = useState(false);
  const score = items.filter((it, i) => ans[i] === it.a).length;
  return (
    <LabShell title={meta.title} desc={meta.desc}>
      <div className="space-y-3">
        {items.map((it, i) => (
          <div key={i} className="rounded-xl border border-slate-200 dark:border-slate-700 p-3">
            <p className="text-sm mb-2">{i + 1}. {it[lang]}</p>
            <div className="flex flex-wrap gap-2">
              {cats.map((c, ci) => {
                const sel = ans[i] === ci;
                const right = checked && ci === it.a;
                const wrong = checked && sel && ci !== it.a;
                return (
                  <button key={ci} onClick={() => { if (!checked) setAns(a => ({ ...a, [i]: ci })); }}
                    className={`px-3 py-1.5 rounded-full text-xs border transition-all ${right ? 'bg-green-100 border-green-500 dark:bg-green-900/30' : wrong ? 'bg-red-100 border-red-400 dark:bg-red-900/30' : sel ? 'bg-[#004030] text-white border-[#004030] dark:bg-[#D8C3A5] dark:text-[#004030] dark:border-[#D8C3A5]' : 'border-slate-300 dark:border-slate-600 hover:border-slate-500'}`}>
                    {c[lang]}
                  </button>
                );
              })}
            </div>
            {checked && it.why && <p className={`mt-2 text-xs italic ${ans[i] === it.a ? 'text-green-600 dark:text-green-400' : 'text-red-500 dark:text-red-400'}`}>{ans[i] === it.a ? '✓' : '✗'} {it.why[lang]}</p>}
          </div>
        ))}
      </div>
      <div className="flex flex-wrap items-center gap-3 mt-4">
        <button className={btnPri} disabled={Object.keys(ans).length < items.length || checked} onClick={() => setChecked(true)}>{t.lab_check}</button>
        <button className={btnSec} onClick={() => { setAns({}); setChecked(false); setItems([...rawItems].sort(() => Math.random() - 0.5)); }}>{t.lab_reset}</button>
        {checked && <span className="text-sm font-bold text-[#004030] dark:text-[#D8C3A5]">{t.lab_score.replace('{c}', score).replace('{n}', items.length)}</span>}
      </div>
      {checked && after}
    </LabShell>
  );
};

        <div className="space-y-4">{label(t.deep_dive_label)}
          <p>{t[`${mk}_p1`]}</p>
          <p className="p-4 bg-slate-100 dark:bg-slate-800 rounded-lg italic font-serif">{t[`${mk}_p2`]}</p>
          <p>{t[`${mk}_p3`]}</p>
          {t[`${mk}_p4`] && <p>{t[`${mk}_p4`]}</p>}
        </div>
        <FigWrap title={t.figure_label}><Fig lang={lang}/></FigWrap>
        <FlipCardDeck key={`cards-${module}-${lang}`} terms={t[`${mk}_terms`]} t={t} moduleId={module} onCardRead={handleCardRead}/>
        <div className="bg-slate-100 dark:bg-slate-800 rounded-xl p-5">{label(t.wrapup_label)}<p className="italic">{t[`${mk}_wrapup`]}</p></div>
        <ModuleQuiz key={`quiz-${module}`} questions={t[`${mk}_q`]} t={t} moduleId={module} onQuizSubmit={handleQuizSubmit} moduleName={t[`${mk}_title`]}/>
      </div>
    );
  };

  const renderLab = () => (
    <div className="space-y-6 animate-fade-in">
      <H2 icon={ICONS[IDX_LAB]} number={IDX_LAB}>{t.mlab_title}</H2>
      <p className="text-lg text-slate-700 dark:text-slate-300">{t.mlab_desc}</p>
      <AnalyzerLab lang={lang} t={t} meta={t.mlab_labs[0]}/>
      <ClassifyLab lang={lang} t={t} meta={t.mlab_labs[1]} cats={LAB2.cats} items={LAB2.items}/>
      <ClassifyLab lang={lang} t={t} meta={t.mlab_labs[2]} cats={LAB3.cats} items={LAB3.items}/>
      <ClassifyLab lang={lang} t={t} meta={t.mlab_labs[3]} cats={LAB4.cats} items={LAB4.items} after={<Lab4After lang={lang}/>}/>
    </div>
  );

  const renderRes = () => (
    <div className="space-y-6 animate-fade-in">
      <H2 icon={ICONS[IDX_RES]} number={IDX_RES}>{t.mres_title}</H2>
      <p className="text-lg text-slate-700 dark:text-slate-300">{t.mres_desc}</p>
      {t.mres_groups.map((g, i) => (
        <div key={i}>
          <h3 className="font-serif font-bold text-lg text-[#004030] dark:text-[#D8C3A5] mb-3">{g.title}</h3>
          <div className="grid grid-cols-1 md:grid-cols-2 gap-3">{g.links.map((l, j) => <LinkCard key={j} {...l}/>)}</div>
        </div>
      ))}
    </div>
  );

  const renderAna = () => {
    const sum = arr => arr.reduce((a, b) => a + b, 0);
    const learnIdx = [...Array(NUM_LEARN).keys()].map(i => i + 1);
    const tc = sum(analytics.quizCorrect), ta = sum(analytics.quizTotal);
    const oa = ta > 0 ? Math.round(tc / ta * 100) : 0;
    const cr = sum(analytics.cardsRead), ctot = learnIdx.reduce((a, i) => a + t[`m${i}_terms`].length, 0);
    const cu = ctot > 0 ? Math.round(cr / ctot * 100) : 0;
    const weak = learnIdx.filter(i => analytics.quizTotal[i] > 0 && analytics.quizCorrect[i] / analytics.quizTotal[i] < 0.75).sort((a, b) => analytics.quizCorrect[a] / analytics.quizTotal[a] - analytics.quizCorrect[b] / analytics.quizTotal[b]);
    const visitedN = learnIdx.filter(i => analytics.visited[i]).length;
    const ready = studentInfo.group && studentInfo.dept && studentInfo.id && studentInfo.nameEn && studentInfo.nameZh;
    const exportCSV = () => {
      if (!ready) return;
      const esc = v => `"${String(v).replace(/"/g, '""')}"`;
      const head = t.csv_headers;
      const rows = modulesList.map(m => {
        const i = m.id; const qn = i >= 1 && i <= NUM_LEARN ? t[`m${i}_q`].length : '';
        const cardsTot = i >= 1 && i <= NUM_LEARN ? t[`m${i}_terms`].length : '';
        const acc = analytics.quizTotal[i] > 0 ? Math.round(analytics.quizCorrect[i] / analytics.quizTotal[i] * 100) : '';
        return [studentInfo.group, studentInfo.dept, studentInfo.id, studentInfo.nameEn, studentInfo.nameZh, m.nav, analytics.time[i], analytics.clicks[i], analytics.visited[i] ? t.csv_yes : t.csv_no, analytics.quizCorrect[i], analytics.quizTotal[i], qn, acc, analytics.cardsRead[i], cardsTot, (analytics.wrongTopics[i] || []).map(q => qText(i, q)).join(t.csv_sep)].map(esc).join(',');
      });
      const csv = '\uFEFF' + head.map(esc).join(',') + '\n' + rows.join('\n');
      const d = new Date(); const p2 = n => String(n).padStart(2, '0');
      const stamp = `${d.getFullYear()}${p2(d.getMonth() + 1)}${p2(d.getDate())}-${p2(d.getHours())}${p2(d.getMinutes())}`;
      const who = lang === 'zh' ? studentInfo.nameZh : studentInfo.nameEn;
      const fname = `${t.brand} ${t.csv_title}_${studentInfo.group} ${who}_${stamp}.csv`;
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = fname; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
    };
    const clearAll = () => {
      if (!window.confirm(t.analytics_wp_clear_confirm)) return;
      try { localStorage.removeItem(LS_KEY); } catch {}
      setAnalytics(emptyAnalytics());
    };
    const inp = 'w-full px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 text-sm';
    return (
      <div className="space-y-6 animate-fade-in">
        <H2 icon={ICONS[IDX_ANA]} number={IDX_ANA}>{t.analytics_title}</H2>
        <p className="text-lg text-slate-700 dark:text-slate-300">{t.analytics_desc}</p>
        <div className="flex flex-wrap items-center justify-between gap-3">
          <span className="text-sm text-green-600 dark:text-green-400">{t.analytics_wp_saved}</span>
          <button onClick={clearAll} className="px-4 py-2 rounded-lg bg-red-600 hover:bg-red-700 text-white text-sm font-bold">{t.analytics_wp_clear}</button>
        </div>
        <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
          {[[t.analytics_total_time, `${sum(analytics.time)}${t.analytics_sec}`], [t.analytics_total_clicks, `${sum(analytics.clicks)}${t.analytics_times}`], [t.analytics_overall_acc, ta > 0 ? `${oa}%` : '—'], [t.analytics_card_usage, `${cu}%`]].map(([a, b], i) => (
            <div key={i} className="bg-white dark:bg-slate-800 rounded-xl p-4 border border-slate-200 dark:border-slate-700">
              <p className="text-xs text-slate-500">{a}</p><p className="text-2xl font-serif font-black text-[#004030] dark:text-[#D8C3A5] mt-1">{b}</p>
            </div>
          ))}
        </div>
        <div className="bg-white dark:bg-slate-800 rounded-2xl p-4 sm:p-6 border border-slate-200 dark:border-slate-700">
          <h3 className="font-serif font-bold text-lg text-[#004030] dark:text-[#D8C3A5] mb-3">{t.analytics_progress_title}</h3>
          <div className="w-full h-3 bg-slate-200 dark:bg-slate-700 rounded-full overflow-hidden mb-4"><div className="h-full bg-[#004030] dark:bg-[#D8C3A5]" style={{ width: `${Math.round(visitedN / NUM_LEARN * 100)}%` }}></div></div>
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2">
            {learnIdx.map(i => (
              <button key={i} onClick={() => go(i)} className="text-left rounded-lg border border-slate-200 dark:border-slate-700 px-3 py-2 hover:border-[#004030] dark:hover:border-[#D8C3A5]">
                <span className="block text-sm font-bold truncate">{ICONS[i]} {modulesList[i].nav}</span>
                <span className="text-xs text-slate-500">{analytics.visited[i] ? `✓ ${t.analytics_progress_visited}` : t.analytics_progress_not_visited}{analytics.quizTotal[i] > 0 ? ` · ${t.analytics_progress_quiz_done}` : ''}</span>
              </button>
            ))}
          </div>
        </div>
        <div className="bg-white dark:bg-slate-800 rounded-2xl p-4 sm:p-6 border border-slate-200 dark:border-slate-700">
          <h3 className="font-serif font-bold text-lg text-[#004030] dark:text-[#D8C3A5] mb-3">{t.analytics_wp_title}</h3>
          {ta === 0 ? <p className="text-sm text-slate-500">{t.analytics_wp_none}</p>
            : weak.length === 0 ? <p className="text-sm text-green-600 dark:text-green-400">{t.analytics_wp_allpass}</p>
            : weak.map(i => (
              <div key={i} className="mb-3 rounded-lg bg-red-50 dark:bg-red-900/20 p-3">
                <p className="font-bold text-sm text-red-700 dark:text-red-300">{modulesList[i].title} — {Math.round(analytics.quizCorrect[i] / analytics.quizTotal[i] * 100)}%</p>
                {(analytics.wrongTopics[i] || []).length > 0 && <><p className="text-xs text-slate-500 mt-1">{t.analytics_wp_incorrect}</p><ul className="list-disc ml-5 text-xs text-slate-600 dark:text-slate-300">{analytics.wrongTopics[i].map((q, k) => <li key={k}>{qText(i, q)}</li>)}</ul></>}
                <button onClick={() => go(i)} className="text-xs font-bold text-[#004030] dark:text-[#D8C3A5] mt-1">{t.analytics_wp_goto}</button>
              </div>
            ))}
        </div>
        <div className="bg-white dark:bg-slate-800 rounded-2xl p-4 sm:p-6 border border-slate-200 dark:border-slate-700 overflow-x-auto">
          <h3 className="font-serif font-bold text-lg text-[#004030] dark:text-[#D8C3A5] mb-3">{t.analytics_detail_title}</h3>
          <table className="w-full text-sm min-w-[560px]">
            <thead><tr className="text-left text-slate-500 border-b border-slate-200 dark:border-slate-700"><th className="py-2 pr-2">{t.analytics_module}</th><th className="py-2 pr-2">{t.analytics_time}</th><th className="py-2 pr-2">{t.analytics_clicks}</th><th className="py-2 pr-2">{t.analytics_cards_read_total}</th><th className="py-2">{t.analytics_correct_ans_total}</th></tr></thead>
            <tbody>
              {modulesList.map(m => {
                const i = m.id; const learn = i >= 1 && i <= NUM_LEARN;
                return (
                  <tr key={i} className="border-b border-slate-100 dark:border-slate-700/60">
                    <td className="py-2 pr-2">{m.nav}</td>
                    <td className="py-2 pr-2">{analytics.time[i]}{t.analytics_sec}</td>
                    <td className="py-2 pr-2">{analytics.clicks[i]}</td>
                    <td className="py-2 pr-2">{learn ? `${analytics.cardsRead[i]} / ${t[`m${i}_terms`].length}` : '—'}</td>
                    <td className="py-2">{learn ? (analytics.quizTotal[i] > 0 ? `${analytics.quizCorrect[i]} / ${analytics.quizTotal[i]} / ${t[`m${i}_q`].length}` : t.analytics_no_data) : '—'}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
        <div className="bg-white dark:bg-slate-800 rounded-2xl p-4 sm:p-6 border border-slate-200 dark:border-slate-700">
          <h3 className="font-serif font-bold text-lg text-[#004030] dark:text-[#D8C3A5] mb-3">{t.analytics_form_title}</h3>
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <label className="text-sm">{t.analytics_group}
              <select className={inp} value={studentInfo.group} onChange={e => setStudentInfo(s => ({ ...s, group: e.target.value }))}>
                <option value="">{t.analytics_group_select}</option>{t.group_options.map(g => <option key={g} value={g}>{g}</option>)}
              </select></label>
            <label className="text-sm">{t.analytics_dept}<input className={inp} placeholder={t.analytics_dept_ph} value={studentInfo.dept} onChange={e => setStudentInfo(s => ({ ...s, dept: sanitizeDept(e.target.value) }))}/></label>
            <label className="text-sm">{t.analytics_id}<input className={inp} inputMode="numeric" placeholder={t.analytics_id_ph} value={studentInfo.id} onChange={e => setStudentInfo(s => ({ ...s, id: sanitizeStudentId(e.target.value) }))}/></label>
            <label className="text-sm">{t.analytics_name_en}<input className={inp} placeholder={t.analytics_name_en_ph} value={studentInfo.nameEn} onChange={e => setStudentInfo(s => ({ ...s, nameEn: sanitizeName(e.target.value) }))}/></label>
            <label className="text-sm">{t.analytics_name_zh}<input className={inp} placeholder={t.analytics_name_zh_ph} value={studentInfo.nameZh} onChange={e => setStudentInfo(s => ({ ...s, nameZh: sanitizeName(e.target.value) }))}/></label>
          </div>
          <div className="flex flex-wrap items-center gap-3 mt-4">
            <button onClick={exportCSV} disabled={!ready} className={btnPri}>{t.analytics_export_csv}</button>
            {!ready && <span className="text-xs text-amber-600 dark:text-amber-400">{t.analytics_fill_required}</span>}
          </div>
        </div>
      </div>
    );
  };

  const body = module === 0 ? renderM0() : module <= NUM_LEARN ? renderLearn() : module === IDX_LAB ? renderLab() : module === IDX_RES ? renderRes() : renderAna();

  return (
    <div className="min-h-screen flex flex-col pt-16 max-w-[100vw]">
      <header className="fixed top-0 left-0 right-0 h-16 bg-[#004030] dark:bg-slate-900 text-white z-50 shadow-lg border-b border-[#D8C3A5]/30">
        <div className="max-w-7xl mx-auto px-2 sm:px-4 h-16 flex items-center justify-between gap-2">
          <div className="flex items-center gap-1 sm:gap-2 min-w-0">
            <div className="relative" ref={menuRef}>
              <button aria-label={t.nav_modules} onClick={() => setMenuOpen(!menuOpen)} className="p-2 hover:bg-white/10 rounded-lg">{menuOpen ? <IconX/> : <IconMenu/>}</button>
              {menuOpen && (
                <div className="absolute top-full left-0 mt-1 w-72 max-w-[calc(100vw-2rem)] max-h-[calc(100vh-5rem)] overflow-y-auto bg-white dark:bg-slate-800 rounded-xl shadow-2xl border border-slate-200 dark:border-slate-700 z-[100] text-slate-700 dark:text-slate-200">
                  <p className="px-4 pt-3 pb-1 text-xs font-bold uppercase tracking-wider text-slate-400">{t.nav_modules}</p>
                  {modulesList.map(m => (
                    <button key={m.id} onClick={() => go(m.id)} className={`w-full flex items-center gap-3 px-4 py-3 text-sm text-left hover:bg-slate-100 dark:hover:bg-slate-700 ${module === m.id ? 'bg-[#004030]/10 dark:bg-[#D8C3A5]/10 font-bold text-[#004030] dark:text-[#D8C3A5]' : ''}`}>
                      <span aria-hidden="true">{m.icon}</span><span className="truncate">{m.nav}</span>
                    </button>
                  ))}
                </div>
              )}
            </div>
            <button aria-label={t.nav_home} onClick={() => go(0)} className="p-2 hover:bg-white/10 rounded-lg"><IconHome size={18}/></button>
            <button onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })} className="flex items-center gap-2 min-w-0">
              <span className="font-serif font-black text-[#D8C3A5] text-lg tracking-widest">{t.brand}</span>
              <span className="hidden sm:inline font-serif font-bold text-sm md:text-base truncate max-w-[40vw] lg:max-w-none">{t.title}</span>
            </button>
          </div>
          <div className="flex items-center gap-1 sm:gap-2 shrink-0">
            <button aria-label={t.audio_read} title={t.audio_read} onClick={() => handleTTS(ttsState === 'playing' ? 'pause' : 'play')} className="p-2 hover:bg-white/10 rounded-lg">{ttsState === 'playing' ? <IconPause size={18}/> : <IconPlay size={18}/>}</button>
            {ttsState !== 'idle' && <button aria-label={t.audio_stop} onClick={() => handleTTS('stop')} className="p-2 hover:bg-white/10 rounded-lg"><IconSquare size={16}/></button>}
            <button onClick={() => setLang(lang === 'en' ? 'zh' : 'en')} className="px-2 sm:px-3 py-1.5 rounded-lg border border-[#D8C3A5]/50 text-[#D8C3A5] text-xs sm:text-sm font-bold hover:bg-white/10">{lang === 'en' ? '中文' : 'EN'}</button>
            <button aria-label="Theme" onClick={() => setIsDark(!isDark)} className="p-2 hover:bg-white/10 rounded-lg">{isDark ? <IconSun size={18}/> : <IconMoon size={18}/>}</button>
          </div>
        </div>
      </header>
      <div className="flex-1 w-full max-w-7xl mx-auto flex">
        <aside className="hidden md:block w-64 shrink-0 border-r border-slate-200 dark:border-slate-800">
          <nav className="sticky top-16 max-h-[calc(100vh-6rem)] overflow-y-auto py-6 px-3 space-y-1">
            {modulesList.map(m => (
              <button key={m.id} onClick={() => go(m.id)} className={`w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm text-left transition-all ${module === m.id ? 'bg-[#004030] text-white dark:bg-[#D8C3A5] dark:text-[#004030] font-bold' : 'hover:bg-slate-200 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300'}`}>
                <SideIcon i={m.id}/><span className="truncate">{m.nav}</span>
              </button>
            ))}
          </nav>
        </aside>
        <main className="flex-1 min-w-0 px-4 sm:px-8 py-8" onClick={addClick}>
          <div key={`${module}`} className="max-w-4xl mx-auto">
            {body}
            <div className="mt-12 flex justify-between items-center pt-8 border-t border-slate-300 dark:border-slate-700">
              <button onClick={() => go(Math.max(0, module - 1))} disabled={module === 0} className="px-4 py-2 rounded-lg border border-[#004030] dark:border-[#D8C3A5] text-[#004030] dark:text-[#D8C3A5] font-bold text-sm disabled:opacity-0">{t.nav_prev}</button>
              <button onClick={() => go(Math.min(TOTAL - 1, module + 1))} disabled={module === TOTAL - 1} className="px-4 py-2 rounded-lg bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] font-bold text-sm disabled:opacity-0">{t.nav_next}</button>
            </div>
          </div>
        </main>
      </div>
      <footer className="h-8 bg-[#004030] flex items-center justify-between px-3 sm:px-4 shrink-0 gap-2">
        <span className="text-[#D8C3A5]/60 text-[10px] sm:text-xs truncate">{t.date} · {t.copyright}</span>
        <span className="text-[#D8C3A5]/60 text-[10px] sm:text-xs flex items-center gap-3 shrink-0">
          <span>{t.architect_label}&nbsp;<a href={t.architect_url} target="_blank" rel="noopener noreferrer" className="text-[#D8C3A5] hover:text-white underline">{t.architect_name}</a></span>
          <button onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })} className="text-[#D8C3A5] hover:text-white font-bold">Top ↑</button>
        </span>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
